name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    # A throwaway Postgres; the games build their playground databases in it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CARDGAME_DATABASE_URL: postgres://postgres@localhost:5432/cards
      TRIVIA_DATABASE_URL: postgres://postgres@localhost:5432/trivia
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          psql -h localhost -U postgres -c "CREATE DATABASE cards" -c "CREATE DATABASE trivia"
      - run: cargo test --workspace --locked
      - name: Cards playground database
        env:
          PLAYGROUND_PROFILE: dev
        run: |
          games/cards/scripts/playground-db.sh
          psql -h localhost -U postgres -d cards -Atc "SELECT count(*) FROM cards" | awk '$1 < 100 { print "only " $1 " cards"; exit 1 }'

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present build
      - run: node --test --experimental-strip-types site/src/lib/playground/runtime.test.ts
      - run: pnpm --filter @tawks/bot run test
