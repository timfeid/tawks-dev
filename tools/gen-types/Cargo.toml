[package]
name = "tawks-gen-types"
version = "0.1.0"
edition = "2024"
description = "Writes the TypeScript types for workflows from the Rust model."
license = "MIT"
publish = false

[dependencies]
specta = { version = "=2.0.0-rc.22", default-features = false, features = ["derive", "serde", "serde_json"] }
specta-typescript = "0.0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tawks-bot = { path = "../../sdk/bot" }
workflow-model = { path = "../../sdk/workflow-model" }
