[package]
name = "tawks-dev-bot"
version = "0.1.0"
edition = "2024"
description = "Runs the Tawks Dev niche: publishes the developer docs to their channels."
license = "MIT"

[[bin]]
name = "tawks-dev"
path = "src/main.rs"

[dependencies]
anyhow = "1"
include_dir = "0.7"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tawks-bot = { path = "../../sdk/bot" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
