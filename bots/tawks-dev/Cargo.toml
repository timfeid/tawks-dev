[package]
name = "tawks-dev-bot"
version = "0.1.0"
edition = "2024"
description = "Keeps the Tawks Dev hub bot online."
license = "MIT"

[[bin]]
name = "tawks-dev"
path = "src/main.rs"

[dependencies]
tawks-telemetry = { path = "../../sdk/telemetry", features = ["tracing"] }
anyhow = "1"
tawks-bot = { path = "../../sdk/bot" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
