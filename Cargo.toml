[workspace]
members = [
    "sdk/bout",
    "sdk/workflow-model",
    "sdk/bot",
    "sdk/framework",
    "sdk/data",
    "examples/bumper-balls/bout",
    "examples/tictactoe/bot",
    "examples/hot-potato/bot",
    "examples/hoard/bot",
    "bots/tawks-dev",
    "tools/devhost",
    "tools/gen-types",
    "games/midnight",
    "games/tracklines",
    "games/cards",
]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0.97"
base64 = "0.22.1"
chrono = { version = "0.4.40", features = ["serde"] }
clap = "4.5.36"
dotenvy = "0.15.7"
futures = "0.3.30"
rand = "0.9.1"
reqwest = { version = "0.12.15", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
specta = { version = "=2.0.0-rc.22", default-features = false }
sqlx = { version = "0.8.1", features = ["postgres", "runtime-tokio-rustls", "time", "chrono", "uuid"] }
tokio = { version = "1.44.1", features = ["rt-multi-thread", "macros", "signal"] }
tokio-tungstenite = "0.26.2"
tokio-util = "0.7.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
ulid = "1.2.0"
