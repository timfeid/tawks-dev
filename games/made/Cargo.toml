[package]
name = "made"
version = "0.1.0"
edition = "2024"
description = "The made minigames relay: players' sockets in, scene frames out, made-simd behind it."
license = "MIT"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true, features = ["ws"] }
base64 = { workspace = true }
dashmap = "6.1.0"
futures = { workspace = true }
hmac = "0.12"
made-protocol = { path = "../made-protocol" }
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = "0.10"
tawks-bot = { path = "../../sdk/bot" }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
workflow = { package = "workflow-model", path = "../../sdk/workflow-model" }

[dev-dependencies]
tokio-tungstenite = { workspace = true }
