[package]
name = "tracklines"
version = "0.1.0"
edition = "2024"
description = "Tracklines, a 3D railway-building game for tawks lobbies."
license = "MIT"

[dependencies]
game-framework = { path = "../../sdk/framework" }
workflow = { package = "workflow-model", path = "../../sdk/workflow-model" }
tawks-bot = { path = "../../sdk/bot" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
rand = { workspace = true }
rand_chacha = "0.9.0"
tracing = { workspace = true }
tokio = { workspace = true }
