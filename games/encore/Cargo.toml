[package]
name = "encore"
version = "0.1.0"
edition = "2024"
description = "Encore: play a song library together on guitar, bass, drums and keys"
license = "MIT"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true, features = ["ws", "multipart"] }
dashmap = "6.1.0"
futures = { workspace = true }
midly = "0.5"
party = { path = "../party" }
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tawks-bot = { path = "../../sdk/bot" }
tokio = { workspace = true }
tower = { version = "0.5", features = ["util"] }
tower-http = { workspace = true, features = ["cors", "fs"] }
tracing = { workspace = true }
workflow = { package = "workflow-model", path = "../../sdk/workflow-model" }
