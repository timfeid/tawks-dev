<div class="space-y-2">
  <p class="text-white font-semibold">You are not alone—unless you are.</p>
  <p>
    If you are the
    <span class="font-medium text-purple-300">only Hollow that wakes up</span>,
    you may
    <span class="font-medium text-purple-300">gaze into the void</span> and view
    <span class="font-medium text-purple-300">one hidden role</span>.
  </p>
  <p>If others rise beside you, remain still. Do not reveal what you are.</p>
  <p class="italic text-gray-400 text-xs">
    Hollows do not trust. They watch. They wait.
  </p>
</div>
