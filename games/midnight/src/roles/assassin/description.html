<div class="space-y-2">
  <p class="text-white font-semibold">You do not serve. You end.</p>

  <p>
    At night, place a
    <span class="font-medium text-red-300">Mark of the Assassin</span> on one
    player. That mark is silent, unseen — but fatal.
  </p>

  <p>
    You win only if the marked player
    <span class="font-medium text-red-300">dies by vote</span> at the end of the
    game. No other outcome matters.
  </p>

  <p class="font-medium text-rose-400">The Assassin works alone.</p>

  <p class="italic text-gray-300 text-xs">
    No team. No allegiance. Just a name in the dark.
  </p>
</div>
