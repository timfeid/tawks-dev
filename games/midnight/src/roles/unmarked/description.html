<div class="space-y-2">
  <p class="text-white font-semibold">No mark, no power, no secret to keep.</p>

  <p>
    You sleep through the night. When the sun rises, your only weapons are
    <span class="font-medium text-green-300">what you hear and who you trust</span>.
  </p>

  <p>
    Your role can still be taken or swapped in the dark, so the card you hold at dawn may not be the one you
    were dealt.
  </p>

  <p class="font-medium text-green-400">The Unmarked align with the village.</p>
</div>
