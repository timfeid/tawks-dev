<div class="space-y-2">
  <p class="text-white font-semibold">You do not speak. You twist.</p>

  <p>
    At night, you
    <span class="font-medium text-blue-200"
      >swap the roles of two other players</span
    >. You do not look at their roles, and they do not know a change occurred.
  </p>

  <p>Your own role remains unchanged — but their destinies do not.</p>

  <p class="font-medium text-green-400">The Tangle is loyal to the village.</p>

  <p class="italic text-gray-400 text-xs">
    You pull the thread — and walk away.
  </p>
</div>
