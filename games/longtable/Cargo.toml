[package]
name = "longtable"
version = "0.1.0"
edition = "2024"
description = "Longtable: dice, initiative and character sheets for a 5E compatible table in a tawks lobby"
license = "MIT"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true, features = ["ws"] }
base64 = { workspace = true }
dashmap = "6.1.0"
futures = { workspace = true }
hmac = "0.12"
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = "0.10"
sqlx = { workspace = true, features = ["runtime-tokio-rustls", "postgres"] }
tawks-bot = { path = "../../sdk/bot" }
tokio = { workspace = true }
tracing = { workspace = true }
workflow = { package = "workflow-model", path = "../../sdk/workflow-model" }

[dev-dependencies]
tokio-tungstenite = { workspace = true }
