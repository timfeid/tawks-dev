[package]
name = "outroads"
version = "0.1.0"
edition = "2024"
description = "Outroads: drive around the real world with friends in a tawks lobby, on OpenStreetMap roads"
license = "MIT"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true, features = ["ws"] }
base64 = { workspace = true }
dashmap = "6.1.0"
futures = { workspace = true }
hmac = "0.12"
rand = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = "0.10"
tawks-bot = { path = "../../sdk/bot" }
tokio = { workspace = true }
tracing = { workspace = true }
workflow = { package = "workflow-model", path = "../../sdk/workflow-model" }

[dev-dependencies]
tokio-tungstenite = { workspace = true }
